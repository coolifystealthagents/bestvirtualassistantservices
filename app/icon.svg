<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Best Virtual Assistant Services logo</title>
  <desc id="desc">A custom VA comparison mark with a BVA wordmark monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="12" y1="10" x2="118" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c2423"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1c2423" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="34" fill="#fff8ee"/>
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bg)" filter="url(#shadow)"/>
  <g transform="translate(16 8) scale(1)">
  <rect x="24" y="26" width="48" height="42" rx="12" fill="#fff8ee"/>
  <path d="M34 42h28M34 54h18" stroke="#0891b2" stroke-width="5" stroke-linecap="round"/>
  <circle cx="70" cy="27" r="9" fill="#4d7c0f"/>
  <path d="M29 75c13-8 26-8 39 0" fill="none" stroke="#0891b2" stroke-width="7" stroke-linecap="round"/>
  </g>
  <rect x="18" y="88" width="92" height="25" rx="12.5" fill="rgba(0,0,0,.24)"/>
  <text x="64" y="106" text-anchor="middle" font-family="Inter, Manrope, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="-.5" fill="#fff8ee">BVA</text>
</svg>
